name: CI/CD - WE Mobile Units

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

jobs:
  # ==================== LINT & TYPE CHECK ====================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck all packages
        run: pnpm run typecheck

      - name: Lint all packages
        run: pnpm run lint

  # ==================== BUILD ALL ====================
  build-all:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @we/shared run build

      - name: Build we-shell
        run: pnpm --filter @we/we-shell run build

      - name: Build we-review
        run: pnpm --filter @we/we-review run build

      - name: Build we-emp
        run: pnpm --filter @we/we-emp run build

      - name: Build we-inv
        run: pnpm --filter @we/we-inv run build

      - name: Build Worker API
        run: pnpm --filter @we/worker-api run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/*/dist
            workers/api/dist
            packages/shared/dist
          retention-days: 1

  # ==================== DEPLOY TO CLOUDFLARE PAGES ====================
  deploy-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build-all
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./dist

      # ---- we-shell (Host) ----
      - name: Deploy we-shell to Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: we-shell
          directory: ./dist/apps/we-shell
          branch: ${{ github.ref_name }}

      # ---- we-review ----
      - name: Deploy we-review to Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: we-review
          directory: ./dist/apps/we-review
          branch: ${{ github.ref_name }}

      # ---- we-emp ----
      - name: Deploy we-emp to Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: we-emp
          directory: ./dist/apps/we-emp
          branch: ${{ github.ref_name }}

      # ---- we-inv ----
      - name: Deploy we-inv to Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: we-inv
          directory: ./dist/apps/we-inv
          branch: ${{ github.ref_name }}

  # ==================== DEPLOY WORKER API ====================
  deploy-worker:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    needs: build-all
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./dist

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker API (Production)
        run: |
          cd workers/api
          wrangler deploy --env production
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Optional: Deploy dev environment on PR
      - name: Deploy Worker API (Dev) - PR
        if: github.event_name == 'pull_request'
        run: |
          cd workers/api
          wrangler deploy --env development
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ==================== NOTIFICATIONS ====================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-worker]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check GitHub Actions for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        shell: bash