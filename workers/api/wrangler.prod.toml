name = "we-mobile-units-api"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"

[[kv_namespaces]]
binding = "CACHE"
id = "your-production-kv-namespace-id"

[[d1_databases]]
binding = "DB"
database_name = "we-mobile-units"
database_id = "your-production-d1-database-id"

[triggers]
crons = ["0 2 * * *"]

[observability]
enabled = true

[build]
command = "npm run build"
watch_dir = "src"