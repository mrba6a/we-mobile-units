name = "we-mobile-units-api-dev"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"

[[kv_namespaces]]
binding = "CACHE"
id = "your-dev-kv-namespace-id"

[[d1_databases]]
binding = "DB"
database_name = "we-mobile-units-dev"
database_id = "your-dev-d1-database-id"

[triggers]
crons = []

[observability]
enabled = true

[build]
command = "npm run build"
watch_dir = "src"